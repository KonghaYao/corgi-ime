# Original schema assembled from documented Rime components. Dictionary is not bundled.
schema:
  schema_id: corgi_pinyin
  name: "柯基拼音 · Corgi"
  version: "0.1"
  author: ["Corgi IME contributors"]
  description: "朙月拼音词典 + 本地计数桌宠；不记录输入正文"
  dependencies: [luna_pinyin]
switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: full_shape
    states: [半角, 全角]
  - name: simplification
    reset: 1
    states: [漢字, 汉字]
  - name: corgi_pause
    reset: 0
    states: [柯基计数, 隐私暂停]
engine:
  processors:
    - lua_processor@*corgi_counter
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors: [ascii_segmentor, matcher, abc_segmentor, punct_segmentor, fallback_segmentor]
  translators: [punct_translator, script_translator]
  filters: [simplifier, uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
translator:
  dictionary: luna_pinyin
  prism: corgi_pinyin
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
punctuator:
  import_preset: default
key_binder:
  import_preset: default
recognizer:
  import_preset: default
